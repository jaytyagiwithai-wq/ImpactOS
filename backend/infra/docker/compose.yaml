name: impactos

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: impactos
      CLICKHOUSE_PASSWORD: local_telemetry_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - impactos
        - --password
        - local_telemetry_password
        - --query
        - SELECT 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local_grafana_password
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.3
    ports:
      - "127.0.0.1:3111:3000"
    volumes:
      - grafana_data:/var/lib/grafana
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: impactos
      POSTGRES_USER: impactos
      POSTGRES_PASSWORD: local_app_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "impactos", "-d", "impactos"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  clickhouse_data:
  grafana_data:
  postgres_data: