receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: impactos
    password: local_telemetry_password
    database: otel
    create_schema: true
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    ttl: 72h
    sending_queue:
      enabled: true
      num_consumers: 1
      batch:
        min_size: 5000
        flush_timeout: 2s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]