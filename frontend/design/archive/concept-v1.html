<script>

 {kind:'Confirmed dependency',style:'',title:'Billing adapter reads the field',description:'The payment handler uses customer_id to look up the billing account. Removing the field requires a consumer change.',path:'billing/handlers.py',version:'b7c21ad',location:'Lines 84–88',why:'The handler directly indexes customer_id. This confirms a code dependency. Runtime behavior after removal still needs testing.',lines:[['84','def on_payment_completed(event):'],['85','    account = find_account('],['86','        event["customer_id"]'],['87','    )'],['88','    account.record_payment(event)']],highlight:'86'},

 {kind:'Unknown',style:'unknown',title:'Analytics consumer needs verification',description:'The service catalog lists an analytics consumer, but its handler source is missing from this snapshot.',path:'No supporting handler source',version:'',location:'',why:'Missing evidence cannot establish whether the analytics consumer reads customer_id. Request the handler source before concluding impact.',lines:[],highlight:''}
];

function home(){return `<div class="container"><header class="top-nav">${brand}<nav class="nav-links" aria-label="Main navigation"><a href="#workflow">Workflow</a><a href="#evidence">Evidence</a><a class="btn primary" href="#workspace">Get started <span aria-hidden="true">↗</span></a></nav></header><main id="main"><section class="hero"><div class="hero-copy"><div class="eyebrow">Change impact intelligence</div><h1>See beyond<br>the diff.</h1><p>Trace an API change through services, customer integrations, and source documents. Review the evidence before you ship.</p><div class="actions"><a class="btn primary" href="#workspace">Get started <span aria-hidden="true">→</span></a><a class="text-link" href="#workspace">View example <span aria-hidden="true">↗</span></a></div><p class="hero-note">Explore the Northstar Payments demo. No sign-in needed.</p></div><div class="sample" aria-label="Synthetic sample impact report"><div class="sample-top"><strong><span class="dot"></span>Northstar Payments</strong><span class="muted">Example investigation</span></div><div class="sample-body"><div class="sample-label">Proposed change</div><h3>Remove a field. Follow the impact.</h3><div class="diff"><div>&nbsp; payment.completed</div><div>&nbsp; &nbsp; payment_id: string</div><div class="removed">− &nbsp; customer_id: string</div><div>&nbsp; &nbsp; amount: integer</div></div><div class="bridge"><span class="mono">Webhook</span><i></i><span>Billing adapter</span><i></i><span>AcmePay</span></div><div class="mini-finding"><span class="mini-icon">↳</span><div><b>Billing adapter reads the field</b><p class="mono">billing/handlers.py · L84–88</p></div></div><div class="mini-finding"><span class="mini-icon" style="background:#fff4df;color:#85510e">?</span><div><b>Customer notice needs review</b><p>Possible impact · cited agreement</p></div></div></div><div class="sample-foot"><span>Synthetic data · 1 dependency · 1 review · 1 unknown</span><a href="#workspace" aria-label="Inspect sample report">↗</a></div></div></section><section class="rule-section" id="workflow"><div><div class="eyebrow">From change to context</div><h2>A diff shows the edit.<br>Evidence shows the reach.</h2><p>Keep the proposed change, its dependencies, and the supporting sources in one investigation.</p></div><div class="step-list"><div class="step"><span class="step-number">01</span><div><strong>Start with a specific change</strong><p>Compare API versions against a selected source snapshot.</p></div></div><div class="step"><span class="step-number">02</span><div><strong>Follow documented dependencies</strong><p>Trace the path from a field to its consumers and customers.</p></div></div><div class="step"><span class="step-number">03</span><div><strong>Inspect what supports each finding</strong><p>Separate confirmed dependencies, possible impacts, and unknowns.</p></div></div></div></section></main></div><section class="evidence-section" id="evidence"><div class="container evidence-grid"><div class="quote-panel"><div class="sample-label">A finding should lead somewhere.</div><p>account = find_account(<br>&nbsp;&nbsp;event["customer_id"]<br>)</p><small>Example source · billing/handlers.py · b7c21ad · L84–88</small></div><div><h2>Keep the source<br>next to the claim.</h2><p>Open the exact excerpt, understand the dependency, and see where evidence is still missing.</p><a class="text-link" style="margin-top:20px" href="#workspace">Inspect the example <span aria-hidden="true">→</span></a></div></div></section><div class="container"><footer class="footer"><strong>ImpactOS</strong><span>Interactive design concept · Synthetic data · Backend not connected</span></footer></div>`}

function inspector(){const f=findings[selected];return `<aside class="inspector" aria-label="Evidence inspector"><div class="inspector-head"><div class="section-label">Supporting evidence</div><div class="source-title">${f.path}</div><div class="source-meta"><span>${f.version?'Version '+f.version:'Not available in this snapshot'}</span><span>${f.location}</span></div></div>${f.lines.length?`<div class="code-view" aria-label="Source excerpt">${f.lines.map(l=>`<div class="code-line ${l[0]===f.highlight?'highlight':''}"><span class="line-no">${l[0]}</span><span class="code-text">${l[1]}</span></div>`).join('')}</div>`:''}<div class="inspector-note"><strong>${f.lines.length?'What this supports':'What is still missing'}</strong><p>${f.why}</p>${f.lines.length?'<button class="text-link" data-source="selected">Open source details ↗</button>':''}</div></aside>`}
function pathView(){return `<div class="path-view"><div class="section-label">Documented relationship path</div><div class="path-row"><div class="path-node changed"><small>Changed field</small><b class="mono">customer_id</b></div><span aria-hidden="true">→</span><div class="path-node"><small>Read by</small><b>Billing adapter</b></div><span aria-hidden="true">→</span><div class="path-node"><small>Integration customer</small><b>AcmePay</b></div></div><p class="path-caption">The example handler reads the field. A fictional integration manifest connects the adapter to AcmePay. This path identifies what to investigate; it does not prove an outage.</p><button class="text-link" data-source="manifest">Inspect integration manifest ↗</button><div class="demo-callout">Analytics is intentionally excluded from this confirmed path: the required handler evidence is missing.</div></div>`}
function report(){return `<div class="report-kicker">INV–014 / NORTHSTAR PAYMENTS</div><div class="report-heading"><h1>Remove customer_id from<br>the payment webhook</h1><a class="btn secondary" href="#new">New investigation <span aria-hidden="true">+</span></a></div><p class="report-description">A review of documented consumers and customer commitments before changing <code>payment.completed</code>.</p><div class="metadata"><span>Baseline<strong>payments-v2</strong></span><span>Proposed<strong>payments-v3</strong></span><span>Snapshot<strong>northstar-014</strong></span></div><div class="tabs" role="tablist" aria-label="Report sections"><button class="tab ${activeTab==='findings'?'active':''}" id="tab-findings" role="tab" aria-controls="report-panel" aria-selected="${activeTab==='findings'}" tabindex="${activeTab==='findings'?0:-1}" data-tab="findings">Findings <span>3</span></button><button class="tab ${activeTab==='paths'?'active':''}" id="tab-paths" role="tab" aria-controls="report-panel" aria-selected="${activeTab==='paths'}" tabindex="${activeTab==='paths'?0:-1}" data-tab="paths">Dependency path</button><button class="tab ${activeTab==='steps'?'active':''}" id="tab-steps" role="tab" aria-controls="report-panel" aria-selected="${activeTab==='steps'}" tabindex="${activeTab==='steps'?0:-1}" data-tab="steps">Next steps</button></div><div id="report-panel" role="tabpanel" aria-labelledby="tab-${activeTab}">${activeTab==='findings'?`<div class="report-columns"><section aria-label="Impact findings"><div class="section-label">What needs attention</div>${findings.map((f,i)=>`<button class="finding ${selected===i?'selected':''}" data-finding="${i}" aria-pressed="${selected===i}"><span class="status ${f.style}">${f.kind}</span><span class="finding-title">${f.title}<span aria-hidden="true">↗</span></span><p>${f.description}</p><span class="finding-source">${f.path}${f.version?' · '+f.version:''}</span></button>`).join('')}</section>${inspector()}</div>`:activeTab==='paths'?pathView():`<div><div class="next-step"><span>01</span><div>Update the billing consumer<p>Choose a supported lookup field and test the handler against both event versions.</p></div></div><div class="next-step"><span>02</span><div>Review the customer migration requirement<p>Ask the integration owner to confirm whether this change triggers the cited notice provision.</p></div></div><div class="next-step"><span>03</span><div>Close the analytics evidence gap<p>Add the missing consumer source to a new snapshot and repeat the investigation.</p></div></div></div>`}</div><div class="coverage"><b>Coverage note.</b> Findings are limited to this synthetic snapshot. An absent finding is not confirmation that a change is safe to deploy.</div>`}
function sources(){return `<div class="report-kicker">NORTHSTAR PAYMENTS</div><div class="report-heading"><h1>Sources</h1><span class="status">Snapshot northstar-014</span></div><p class="report-description">The source versions behind the sample investigation.</p><table class="source-table"><thead><tr><th scope="col">Source</th><th scope="col">Version</th><th scope="col">Type</th><th scope="col">Evidence</th></tr></thead><tbody><tr><td><code>billing/handlers.py</code></td><td>b7c21ad</td><td>Code</td><td><button class="text-link" data-source="0">View ↗</button></td></tr><tr><td><code>customers/acmepay-agreement.md</code></td><td>v2</td><td>Document</td><td><button class="text-link" data-source="1">View ↗</button></td></tr><tr><td><code>integrations/acmepay.yaml</code></td><td>v1</td><td>Manifest</td><td><button class="text-link" data-source="manifest">View ↗</button></td></tr><tr><td><code>webhooks/payment.yaml</code></td><td>v2 → v3</td><td>OpenAPI excerpt</td><td><button class="text-link" data-source="schema">View ↗</button></td></tr></tbody></table><div class="demo-callout">Design concept: these sources are embedded examples. Upload, indexing, and version management are specified in the frontend plan and will connect to your backend.</div>`}
function newView(){return `<div class="report-kicker">NEW INVESTIGATION / DESIGN PREVIEW</div><h1 style="font-size:32px">Start with a change.</h1><p class="report-description">The final form will accept your API versions and source snapshot. This preview opens the fixed example below.</p><div class="form-panel"><div class="form-row"><label>Project</label><div class="static-input">Northstar Payments</div></div><div class="form-row"><label>Baseline → proposed version</label><div class="static-input mono">payments-v2 → payments-v3</div></div><div class="form-row"><label>Proposed change</label><div class="static-input">Remove customer_id from payment.completed</div></div><div class="form-row"><label>Source snapshot</label><div class="static-input mono">northstar-014</div></div><p>Sample only. No files are uploaded and no AI analysis is performed.</p><a class="btn primary" href="#workspace">Open sample investigation →</a></div>`}
function workspace(route){const names={workspace:'Investigations / INV–014',sources:'Sources',dependencies:'Dependencies',new:'Investigations / New'};return `<div class="shell">${side(route)}<div class="app-body"><header class="app-top"><span>${names[route]}</span><span class="demo-note"><span class="dot"></span>Demo · Sample data</span></header><main class="app-content" id="main">${route==='sources'?sources():route==='dependencies'?'<div class="report-kicker">NORTHSTAR PAYMENTS</div><h1 style="font-size:32px">Dependencies</h1><p class="report-description">A focused view of the evidence-backed sample path.</p>'+pathView():route==='new'?newView():report()}</main><footer class="screen-note">Interactive frontend concept. Authentication, uploads, and analysis will connect to your backend.</footer></div></div>`}
function render(){const route=location.hash.slice(1)||'home';const homeSection=['home','workflow','evidence','main'].includes(route);root.innerHTML=homeSection?home():workspace(['workspace','sources','dependencies','new'].includes(route)?route:'workspace');document.title=homeSection?'ImpactOS — See beyond the diff':'ImpactOS — Demo workspace';if(route==='workflow'||route==='evidence')document.getElementById(route)?.scrollIntoView();else window.scrollTo(0,0)}
function openSource(key){let title,text,meta;if(key==='manifest'){title='integrations/acmepay.yaml';meta='Version v1 · Snapshot northstar-014';text='customer: AcmePay\nadapter: billing\nevent: payment.completed\n\n# Synthetic manifest: customer-to-adapter relationship.'}else if(key==='schema'){title='webhooks/payment.yaml';meta='OpenAPI excerpt · payments-v2 → payments-v3';text='payment.completed:\n  payment_id: string\n- customer_id: string\n  amount: integer\n\n# Synthetic diff: customer_id is removed in v3.'}else{const f=findings[key==='selected'?selected:Number(key)];title=f.path;meta='Version '+f.version+' · '+f.location+' · Snapshot northstar-014';text=f.lines.map(l=>l[0]+'  '+l[1]).join('\n')}document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').replaceChildren();const metaEl=document.createElement('p');metaEl.textContent=meta;const pre=document.createElement('pre');pre.textContent=text;const note=document.createElement('p');note.textContent='Fictional example for the ImpactOS frontend concept. This source is not fetched from a backend.';document.getElementById('dialog-body').append(metaEl,pre,note);sourceDialog.showModal()}
document.addEventListener('click',e=>{const f=e.target.closest('[data-finding]');if(f){const y=window.scrollY;selected=Number(f.dataset.finding);render();window.scrollTo(0,y);document.querySelector(`[data-finding="${selected}"]`).focus({preventScroll:true})}const t=e.target.closest('[data-tab]');if(t){const y=window.scrollY;activeTab=t.dataset.tab;render();window.scrollTo(0,y);document.getElementById('tab-'+activeTab).focus({preventScroll:true})}const s=e.target.closest('[data-source]');if(s)openSource(s.dataset.source)});
document.addEventListener('keydown',e=>{if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['findings','paths','steps'];let i=tabs.indexOf(activeTab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;activeTab=tabs[i];const y=window.scrollY;render();window.scrollTo(0,y);document.getElementById('tab-'+activeTab).focus({preventScroll:true})}});
document.getElementById('close-dialog').addEventListener('click',()=>sourceDialog.close());
window.addEventListener('hashchange',render);render();
</script>
</body>
